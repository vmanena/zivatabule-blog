version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 5
    groups:
      astro-dependencies:
        patterns:
          - "astro"
          - "@astrojs/*"
    commit-message:
      prefix: "deps"
